<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>BurnnByte Mobile</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #101827;
        color: #f3f4f6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(249, 115, 22, 0.3), transparent 35%),
          linear-gradient(180deg, #101827 0%, #111827 100%);
      }

      main {
        width: min(28rem, calc(100vw - 2rem));
        padding: 1.5rem;
        border-radius: 1rem;
        background: rgba(17, 24, 39, 0.9);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 0.75rem;
        line-height: 1.5;
      }

      code {
        font-family: "SFMono-Regular", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BurnnByte Mobile Shell</h1>
      <p>
        Set <code>CAPACITOR_SERVER_URL</code> before running
        <code>npm run sync</code> so the native app points at your deployed site.
      </p>
      <p>
        This local fallback page exists only so Capacitor has bundled content if
        no remote URL is configured yet.
      </p>
    </main>
  </body>
</html>
